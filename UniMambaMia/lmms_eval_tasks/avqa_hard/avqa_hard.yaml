# Item ids and our single-frame probe outputs only; the questions, options and answers are joined
# from the official AVQA release at load time (see utils.process_docs).
dataset_path: gwkrsrch/avqa_hard
dataset_kwargs:
  video: True
  cache_dir: avqa_cropped_videos_loadable
task: "avqa_hard"
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs
doc_to_visual: !function utils.avqa_hard_doc_to_visual
doc_to_text: !function utils.avqa_hard_doc_to_text_mc
doc_to_target: !function utils.avqa_hard_doc_to_target
process_results: !function utils.avqa_hard_mc_process_results
generation_kwargs:
  max_new_tokens: 20
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."